<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Math Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600;700&family=Creepster&family=Nunito:wght@600;800;900&display=swap">
<style>
:root {
  --bg: #0d0a14;
  --panel: #19121f;
  --panel2: #251a30;
  --line: #3d2f4d;
  --text: #f6f0fb;
  --dim: #b2a3c4;
  --gold: #f5c542;
  --good: #4ade80;
  --bad: #f87171;
  --glow: #a07bff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }

.btn { border: 0; border-radius: 16px; padding: 14px 22px; font-weight: 900; font-size: clamp(17px, 2.4vmin, 22px); background: var(--panel2); color: var(--text); box-shadow: 0 5px 0 #0008; transition: transform .1s; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0008; }
.btn.go { background: linear-gradient(#ffd75e, #e9a923); color: #2a1a05; }
.btn.small { padding: 9px 14px; font-size: 15px; border-radius: 12px; }
.btn.ghost { background: #ffffff14; box-shadow: none; }

/* ---------- HUD */
#hud { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
.chip { background: #0d0a14cc; border: 1px solid #ffffff22; border-radius: 999px; padding: 7px 14px; font-weight: 900; font-size: clamp(14px, 2.2vmin, 19px); white-space: nowrap; backdrop-filter: blur(4px); }
#hudLeft, #hudRight { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#hudRight { justify-content: flex-end; }
#stars { color: var(--gold); letter-spacing: 2px; }
.off { color: #ffffff33; }
#topBtn { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 5; }
#toast { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); z-index: 50; background: #1b1424f0; border: 2px solid var(--glow); border-radius: 16px; padding: 12px 20px; font-weight: 900; font-size: clamp(16px, 2.5vmin, 22px); text-align: center; max-width: min(90vw, 560px); pointer-events: none; opacity: 0; transition: opacity .25s; }
#toast.show { opacity: 1; }
#toast.gold { border-color: var(--gold); color: #ffe9a8; }

/* ---------- Screens and modals */
.screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: calc(env(safe-area-inset-top, 0px) + 20px) 18px calc(env(safe-area-inset-bottom, 0px) + 20px); background: radial-gradient(ellipse at 50% 30%, #2a1a3e 0%, #0d0a14 70%); overflow-y: auto; }
.screen.clear { background: #0d0a14d9; }
h1.title { font-family: Creepster, Nunito, sans-serif; font-weight: 400; font-size: clamp(54px, 11vmin, 110px); margin: 0; color: #e9d5ff; text-shadow: 0 0 24px #a07bffaa, 0 5px 0 #3b1d5a; letter-spacing: 2px; text-align: center; line-height: 1; }
h2 { margin: 0; font-size: clamp(24px, 4vmin, 36px); text-align: center; }
.tag { color: var(--dim); font-weight: 800; text-align: center; max-width: 560px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.players { display: grid; gap: 10px; width: min(560px, 100%); }
.pl { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.pl.cur { border-color: var(--gold); }
.pl .nm { flex: 1; font-weight: 900; font-size: 20px; }
.pl .lv { color: var(--dim); font-weight: 800; font-size: 14px; }
.pl input { flex: 1; font: 900 20px Nunito, sans-serif; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: #0d0a14; color: var(--text); min-width: 0; }
.levels { display: grid; gap: 10px; width: min(560px, 100%); }
.levels button { text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); font-weight: 900; font-size: 19px; }
.levels button.on { border-color: var(--gold); background: #3a2c10; }
.levels small { display: block; color: var(--dim); font-weight: 800; font-size: 14px; margin-top: 2px; }
#homeArt { width: min(420px, 70vw); height: min(300px, 32vh); }

/* ---------- Challenge */
#ch .card { width: min(720px, 100%); background: var(--panel); border: 3px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; box-shadow: 0 20px 60px #000a; }
#ch.inkwell .card { background: #fff8e6; color: #1a1410; border-color: #1a1410; }
#ch.inkwell .msg { color: #4a3a2a; }
#ch.inkwell .btn.ghost { color: #1a1410; background: #1a141014; }
#chArt { width: 100%; height: clamp(150px, 26vh, 280px); border-radius: 16px; background: #0d0a14; }
#chAsk { font-size: clamp(30px, 6.4vmin, 58px); font-weight: 900; text-align: center; line-height: 1.15; }
#chAsk.read { font-size: clamp(20px, 3.3vmin, 28px); }
.msg { color: var(--dim); font-weight: 800; text-align: center; min-height: 1.3em; font-size: clamp(16px, 2.4vmin, 20px); }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--good); }
.answer { min-width: 4.2em; padding: 6px 18px; border-radius: 14px; background: #0d0a14; border: 3px solid var(--line); font-size: clamp(32px, 6vmin, 54px); font-weight: 900; text-align: center; min-height: 1.4em; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(440px, 100%); }
.pad button { border: 0; border-radius: 14px; background: var(--panel2); font-size: clamp(24px, 4.6vmin, 36px); font-weight: 900; padding: 10px 0; box-shadow: 0 4px 0 #0008; }
.pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0008; }
.pad .ok { background: linear-gradient(#5be38d, #22a35a); color: #04210f; }
.pad .del { background: #4a2d3a; }
.choices { display: grid; gap: 10px; width: min(560px, 100%); }
.choices.cols { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.choices button { border: 3px solid var(--line); background: var(--panel2); border-radius: 16px; padding: 14px; font-size: clamp(20px, 3.4vmin, 30px); font-weight: 900; }
.choices button.no { opacity: .3; pointer-events: none; }
.choices button.yes { border-color: var(--good); background: #12351f; }
.sentences { display: grid; gap: 8px; width: 100%; }
.sentences button { text-align: left; border: 2px dashed #8a7a66; background: #fffdf5; color: #1a1410; border-radius: 10px; padding: 10px 14px; font: 700 clamp(18px, 2.8vmin, 24px) Caveat, Nunito, sans-serif; }
.sentences button.no { opacity: .35; text-decoration: line-through; pointer-events: none; }
.sentences button.yes { border: 3px solid #16a34a; background: #dcfce7; }
.sign { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 16px; border-radius: 12px; background: #fef3c7; border: 5px solid #1a1410; box-shadow: 6px 6px 0 #1a1410; color: #1a1410; }
.sign button { border: 0; background: transparent; font: 400 clamp(26px, 5vmin, 44px) Bangers, Nunito, sans-serif; letter-spacing: 1px; padding: 2px 6px; border-radius: 8px; color: #1a1410; }
.sign button.no { background: #fecaca; }
.sign button.zapped { background: #fde047; outline: 3px solid #1a1410; }
.bricks { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.bricks button { min-width: clamp(96px, 20vmin, 150px); padding: 22px 12px 14px; border-radius: 8px; border: 0; font: 900 clamp(22px, 4.4vmin, 36px) Nunito, sans-serif; color: #fff; text-shadow: 0 2px 0 #0007; box-shadow: inset 0 -8px 0 #0004, 0 8px 0 #0a0710; transition: transform .2s, opacity .3s; }
.bricks button.no { transform: translateY(30px) rotate(12deg); opacity: .2; pointer-events: none; }
.bricks button.yes { outline: 5px solid #4ade80; }
.coins { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.coins button { width: clamp(70px, 13vmin, 96px); height: clamp(70px, 13vmin, 96px); border-radius: 50%; border: 4px solid #0006; font-weight: 900; font-size: clamp(16px, 2.8vmin, 22px); box-shadow: 0 5px 0 #0008; }
.coins button.bill { border-radius: 12px; width: clamp(110px, 18vmin, 140px); background: #86c58a; color: #0c2a12; }
.paid { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; min-height: 34px; }
.paid span { font-size: 13px; font-weight: 900; padding: 4px 8px; border-radius: 999px; background: #ffffff1a; }
.wide { width: min(560px, 100%); }
.roomgrid { --cell: clamp(26px, min(4.6vh, 6.4vw), 48px); display: grid; grid-template-columns: repeat(10, var(--cell)); gap: 3px; padding: 8px; background: #3b2a1a; border-radius: 12px; touch-action: none; }
.roomgrid button { width: var(--cell); height: var(--cell); padding: 0; border: 4px solid transparent; border-radius: 5px; background: #e8dcc4; }
.roomgrid button:hover { filter: brightness(1.08); }
.roomgrid button.on { background: #c084fc; }
.roomgrid button.hint:not(.on) { outline: 3px dashed #e9a923; outline-offset: -6px; }

/* ---------- Room cards */
.cards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: min(900px, 100%); }
.cards button { width: clamp(150px, 27vw, 250px); border: 3px solid var(--line); background: var(--panel); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; box-shadow: 0 8px 0 #0008; }
.cards button:active { transform: translateY(4px); }
.cards canvas { width: 100%; aspect-ratio: 16 / 10; border-radius: 10px; background: #000; }
.cards b { font-size: clamp(17px, 2.6vmin, 22px); }
.cards small { color: var(--dim); font-weight: 800; font-size: 14px; }
.cards .rare { border-color: var(--gold); }

/* ---------- Comic panels */
.panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(960px, 100%); }
.panels canvas { width: 100%; aspect-ratio: 4 / 5; background: #fff8e6; border: 5px solid #111; box-shadow: 6px 6px 0 #111; }
@media (max-width: 620px) { .panels { grid-template-columns: 1fr; width: min(300px, 100%); } .panels canvas { aspect-ratio: 16 / 10; } }

/* ---------- Journal */
#journal .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
#journal .tabs button.on { background: var(--gold); color: #2a1a05; }
.jgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: min(900px, 100%); }
.jgrid button { border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 900; }
.jgrid canvas { width: 100%; aspect-ratio: 1; }
.jgrid .unmet { color: var(--dim); }
.jpage { width: min(620px, 100%); background: #fff8e6; color: #1a1410; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 4px solid #3b2a1a; }
.jpage canvas { width: min(260px, 60vw); aspect-ratio: 1; }
.jpage h3 { margin: 0; font-size: 28px; }
.jpage ul { margin: 0; padding-left: 22px; font: 700 clamp(19px, 2.8vmin, 24px) Caveat, Nunito, sans-serif; align-self: stretch; }
.shop { display: grid; gap: 10px; width: min(560px, 100%); }
.shop button { display: flex; gap: 12px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px; font-weight: 900; font-size: 19px; }
.shop button[disabled] { opacity: .45; }
.shop .em { font-size: 34px; }
.shop small { display: block; color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" hidden>
  <div id="hudLeft">
    <button class="chip" id="homeBtn" aria-label="Menu">☰</button>
    <span class="chip" id="towerName"></span>
    <span class="chip" id="floorChip"></span>
  </div>
  <div id="hudRight">
    <span class="chip" id="clockChip" hidden></span>
    <span class="chip" id="coinChip"></span>
    <span class="chip" id="stars"></span>
    <button class="chip" id="journalBtn">📖 Journal</button>
  </div>
</div>
<button class="btn small" id="topBtn" hidden>⬆ Top floor</button>
<div id="toast"></div>

<div class="screen" id="home">
  <canvas id="homeArt"></canvas>
  <h1 class="title">The Math Maker</h1>
  <div class="tag" id="homeTag"></div>
  <div class="row">
    <button class="btn go" id="playBtn">▶ Build!</button>
    <button class="btn" id="homeJournal">📖 Journal</button>
  </div>
  <div class="row">
    <button class="btn small ghost" id="playerBtn"></button>
    <button class="btn small ghost" id="soundBtn"></button>
  </div>
</div>

<div class="screen" id="playersScr" hidden></div>
<div class="screen clear" id="ch" hidden><div class="card" id="chCard"></div></div>
<div class="screen clear" id="cardsScr" hidden></div>
<div class="screen clear" id="eventScr" hidden></div>
<div class="screen" id="journal" hidden></div>

<script>
"use strict";
/* =====================================================================
   The Math Maker. Build a haunted hotel one floor at a time.
   Everything is drawn in code and every sound is synthesized.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has("debug");
const SPEED = clamp(+Q.get("speed") || 1, 0.25, 10);
const $ = id => document.getElementById(id);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const wait = ms => new Promise(r => setTimeout(r, ms / SPEED));
/** Small seeded generator, so a tower's event plan never re-rolls on reload. */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================
   Saves: one per player, the Door Codes pattern.
   ===================================================================== */
const PKEY = "mathmaker.players";
const saveKey = id => `mathmaker.v1.${id}`;
let P = { list: [{ id: "p1", name: "" }], cur: "p1" };
try { const saved = JSON.parse(localStorage.getItem(PKEY)); if (saved && Array.isArray(saved.list) && saved.list.length) P = saved; } catch {}
function savePlayers() { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch {} }
const playerName = pl => pl.name || `Player ${P.list.indexOf(pl) + 1}`;
const curPlayer = () => P.list.find(x => x.id === P.cur) || P.list[0];
function fresh() {
  return {
    settings: { mode: "times", sound: true, picked: false },
    facts: {},            // key -> { box 0..4, seen, right }
    tier: { plus: 1, times: 3, alg: 2 },
    recent: { plus: [], times: [], alg: [] },
    due: [],              // missed facts come back a few doors later
    q: 0,
    ms: [],               // recent first-try answer times
    seed: Math.floor(Math.random() * 2 ** 31),
    tower: 0,             // which tower is being built
    floors: [],           // the current tower: [{ room, guests: [] }]
    done: [],             // finished towers: [{ id, floors }]
    plans: {},            // tower index -> { floor: event }
    stars: 0,
    coins: 0,
    met: {}, rooms: {}, stickers: {}, items: {},
    misses: 0,
  };
}
function load(id) {
  let s = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(saveKey(id)));
    if (saved && typeof saved === "object") {
      s = Object.assign(fresh(), saved);
      for (const k of ["settings", "tier", "recent"]) s[k] = Object.assign(fresh()[k], saved[k]);
    }
  } catch {}
  return s;
}
let S = load(curPlayer().id);
function save() { try { localStorage.setItem(saveKey(P.cur), JSON.stringify(S)); } catch {} }
function switchPlayer(id) { save(); P.cur = id; savePlayers(); S = load(id); recentKeys.length = 0; cam.y = null; }

/* =====================================================================
   Sound: all synthesized.
   ===================================================================== */
let AC = null, master = null;
function audio() {
  if (!S.settings.sound) return null;
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination); }
    catch { return null; }
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, d, { type = "sine", v = 0.2, f2 = 0, delay = 0 } = {}) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + 0.05);
}
function noise(d, { v = 0.2, f = 1000, q = 1, delay = 0, f2 = 0 } = {}) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + delay, len = Math.ceil(ac.sampleRate * d), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; flt.type = "bandpass"; flt.frequency.setValueAtTime(f, t); flt.Q.value = q;
  if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  src.connect(flt).connect(g).connect(master); src.start(t);
}
const sfx = {
  key: () => tone(700, 0.04, { type: "square", v: 0.04 }),
  right: () => { tone(660, 0.12, { type: "triangle", v: 0.14 }); tone(990, 0.18, { type: "triangle", v: 0.14, delay: 0.1 }); },
  wrong: () => { tone(220, 0.25, { type: "sawtooth", v: 0.08, f2: 140 }); },
  unlock: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, { type: "triangle", v: 0.14, delay: i * 0.09 })),
  creak: () => { tone(180, 0.6, { type: "sawtooth", v: 0.05, f2: 120 }); noise(0.5, { v: 0.08, f: 500, q: 3 }); },
  hammer: () => { noise(0.07, { v: 0.35, f: 1800, q: 0.8 }); tone(160, 0.08, { type: "square", v: 0.08, f2: 90 }); },
  saw: () => { for (let i = 0; i < 4; i++) noise(0.12, { v: 0.12, f: 2600 + (i % 2) * 900, q: 2, delay: i * 0.13 }); },
  sparkle: () => [1568, 2093, 2637].forEach((f, i) => tone(f, 0.18, { type: "triangle", v: 0.05, delay: i * 0.07 })),
  coin: () => { tone(1320, 0.07, { type: "square", v: 0.05 }); tone(1760, 0.16, { type: "square", v: 0.05, delay: 0.07 }); },
  clonk: () => { tone(70, 0.35, { type: "square", v: 0.14, f2: 40 }); noise(0.25, { v: 0.3, f: 500, q: 0.8 }); },
  tiptoe: () => tone(1900, 0.03, { type: "sine", v: 0.03 }),
  chomp: () => { noise(0.12, { v: 0.25, f: 700, q: 1 }); noise(0.12, { v: 0.25, f: 500, q: 1, delay: 0.16 }); },
  snore: () => { noise(1.1, { v: 0.12, f: 260, f2: 160, q: 1.5 }); },
  grr: () => { tone(90, 0.6, { type: "sawtooth", v: 0.12, f2: 60 }); noise(0.5, { v: 0.1, f: 300, q: 1 }); },
  note: f => tone(f, 0.28, { type: "triangle", v: 0.12 }),
  horn: () => { tone(277, 0.9, { type: "sawtooth", v: 0.06 }); tone(349, 0.9, { type: "sawtooth", v: 0.05 }); tone(415, 0.9, { type: "sawtooth", v: 0.04 }); },
  chug: () => { for (let i = 0; i < 8; i++) noise(0.09, { v: 0.14, f: 400, q: 1, delay: i * 0.22 }); },
  splat: () => { noise(0.4, { v: 0.3, f: 300, f2: 120, q: 0.7 }); tone(120, 0.3, { v: 0.1, f2: 60 }); },
  pow: () => { noise(0.3, { v: 0.35, f: 900, f2: 300, q: 0.6 }); tone(330, 0.25, { type: "square", v: 0.06, f2: 110 }); },
  whoosh: () => noise(0.5, { v: 0.2, f: 600, f2: 3000, q: 1 }),
  party: () => { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.25, { type: "triangle", v: 0.12, delay: i * 0.12 })); for (let i = 0; i < 5; i++) noise(0.3, { v: 0.2, f: 3000, q: 0.5, delay: 0.9 + i * 0.25 }); },
  click: () => tone(1200, 0.03, { type: "square", v: 0.03 }),
};

let toastTimer = 0;

/** A comic-book starburst with a word in it. */
function burst(x, y, r, word, t, fill = "#ffe14d") {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 2) * 0.05);
  ctx.beginPath(); for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, rad = i % 2 ? r * 0.7 : r; ctx.lineTo(Math.cos(a) * rad * 1.3, Math.sin(a) * rad); }

  ctx.fillStyle = "#e11d48"; ctx.font = `${Math.round(r * 0.62)}px Bangers, Nunito, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(2, r * 0.06); ctx.strokeText(word, 0, 2); ctx.fillText(word, 0, 2);
  ctx.restore();
}

/** Guests wander back and forth in their room. */
function drawRoomGuests(f, r, i, t) {
  const n = f.guests.length;
  f.guests.forEach((id, k) => {
    const g = GUEST[id]; if (!g) return;
    const span = r.w * 0.36, base = r.x + r.w * (0.2 + 0.6 * (k + 0.5) / n);
    const gx = base + Math.sin(t * 0.35 + i * 1.7 + k * 2.1) * span / Math.max(1, n);
    const h = g.wide ? r.h * 0.5 : g.float ? r.h * 0.42 : r.h * 0.62;
    drawGuest(id, gx, r.y + r.h * (g.float ? 0.62 : 0.88), h, t + k);
  });
}

function drawFloors(t, g) {
  roomRects.length = 0;
  drawLobby(t, g);
  const th = tower();
  for (let i = 1; i <= built(); i++) {
    const r = frameFloor(g, i);
    if (r.y > H + 10 || r.y + r.h < -10) continue;
    const f = S.floors[i - 1];
    drawRoom(f.room, r.x, r.y, r.w, r.h, t, th);
    drawRoomGuests(f, r, i, t);
    // floor number plate
    ctx.fillStyle = th.ink ? "#111" : "#0d0a14cc"; rr(r.x - 2, r.y + 6, 44, 24, 6); ctx.fill();
    ctx.fillStyle = th.ink ? "#fff" : th.trim; ctx.font = "900 15px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(i, r.x + 20, r.y + 18);
    roomRects.push({ i, ...r });
  }
  // the elevator: earned at floor 10
  if (built() >= 10 || S.done.length) drawElevator(t, g);
}

function drawElevator(t, g) {
  const n = built(), x = g.x0 + g.tw + 4, w = Math.min(34, g.tw * 0.07);
  const top = sy((n + 1) * g.fh, g), bot = sy(0, g);
  ctx.fillStyle = "#ffffff12"; ctx.fillRect(x, top, w, bot - top);
  ctx.strokeStyle = tower().trim; ctx.lineWidth = 2; ctx.strokeRect(x, top, w, bot - top);
  const p = (Math.sin(t * 0.25) + 1) / 2, cy = lerp(bot - g.fh * 0.5, top + g.fh * 0.5, p);
  ctx.fillStyle = "#f5c542"; rr(x + 3, cy - 18, w - 6, 36, 4); ctx.fill();
  ctx.fillStyle = "#ffd27a"; ctx.fillRect(x + 6, cy - 12, w - 12, 14);
}

const SHOP_EVERY = 12;
const isShop = f => f % SHOP_EVERY === 0;
const MIDNIGHT_EVERY = 8;

const fixedAt = (f, towerIdx) => isShop(f) || (towerIdx === 1 && f % MIDNIGHT_EVERY === 0);

function keypad(q, hooks = {}) {

    const body = $("chBody");

      $("chAsk").className = ""; $("chAsk").innerHTML = `Feed Wedge <b>${g.a}/${g.b}</b> of the pie`;
      msg(g.slices === g.b ? "Tap slices to pick them. Then feed him." : `This pie has ${g.slices} slices. Same fraction, more pieces!`);

          plates++; S.misses++; sfx.wrong();
          msg(plates === 1 ? (k * g.b > g.a * g.slices ? "Too much! He only wants his share." : "Not enough! He wants more.") : `The bottom number is ${g.b}, so split the pie into ${g.b} equal parts. Each part is ${g.slices / g.b} slice${g.slices / g.b > 1 ? "s" : ""}. He wants ${g.a} parts: ${g.answer} slices.`, "bad");

    }

    msg("Wedge is full. He floats into the new floor.", "good");

  },

      ctx.fillStyle = "#1b1424"; ctx.fillRect(0, 0, w, h);
      for (let k = 0; k < 5; k++) { ctx.fillStyle = "#2a1f38"; rr(w * (0.06 + k * 0.19), h * 0.2, w * 0.12, h * 0.62, 10); ctx.fill(); }

      gr.addColorStop(0, "#0000"); gr.addColorStop(0.7, "#000c"); gr.addColorStop(1, "#000");

/* =====================================================================
   The loop: door -> build -> pick a room -> guests -> extras.
   ===================================================================== */
async function openDoor() {
  if (busy) return;
  busy = true;
  try {
    const floor = built() + 1, ev = eventAt(floor), kind = ev ? EVENTS[ev].ch : "code";
    sfx.creak();
    cam.target = camGoal();
    await (CHALLENGES[kind] || CHALLENGES.code)(floor, ev);
    chClose();
    S.coins += 2;
    await buildFloor(floor, ev);
  } finally { busy = false; hud(); save(); }
}

async function buildFloor(floor, ev) {
  const g = geo(), r = frameFloor(g, floor);
  fx.build = { k: 0, dur: 1.8 };
  sfx.saw();
  const ticks = setInterval(() => { sfx.hammer(); const rr2 = frameFloor(geo(), floor); puff(rr2.x + rr2.w * (0.2 + Math.random() * 0.6), rr2.y + rr2.h * (0.4 + Math.random() * 0.5), 10, ["#e8c58a", "#c99a5b", "#f5deb3"]); puff(rr2.x + rr2.w * Math.random(), rr2.y + rr2.h * 0.5, 5, ["#fff6a0", "#ffd75e"], { spark: true, up: 300 }); }, 260 / SPEED);
  await wait(1800);
  clearInterval(ticks);
  // pick what goes on the new floor
  const room = await pickRoom(floor);
  fx.build = null;
  const f = { room, guests: [] };
  S.floors.push(f);
  S.rooms[room] = true;
  if (room === "slide") gainSticker("slide");
  sfx.unlock(); puff(r.x + r.w / 2, r.y + r.h / 2, 30, ["#f5c542", "#ff8ad8", "#7dffb0"]);
  // check-in
  const who = eventGuest(ev, floor);
  if (who) { if (!GUEST[who].wide) f.guests.push(who); meet(who); }
  const pool = S.tower === 0 || Math.random() < 0.15 ? WANDERERS.concat(VISITORS) : WANDERERS, unmet = pool.filter(id => !S.met[id]);
  if (VISITORS.includes(stagedGuest)) { f.guests.push(stagedGuest); meet(stagedGuest); stagedGuest = null; }
  else if (!who || Math.random() < 0.3) if (Math.random() < 0.75 || unmet.length) { const id = unmet.length && Math.random() < 0.6 ? pick(unmet) : pick(pool); f.guests.push(id); meet(id); }
  cam.target = camGoal();
  save(); hud();
  if (S.tower === 0 && floor === 1) meet("hoot");
  if (tower().ink && floor < TOP && floor % 10) await comicPop(floor);
  // flavor that happens after the build
  if (ev && EVENTS[ev].after === "stars") { toast("🌠 Shooting stars! Tap one!", "gold", 3500); for (let i = 0; i < 4; i++) setTimeout(() => fx.stars.push({ x: -40, y: H * (0.08 + Math.random() * 0.2), vx: 380 + Math.random() * 200, vy: 60 + Math.random() * 60, life: 6 }), i * 1100 / SPEED); }
  if (ev && EVENTS[ev].after === "giant") { fx.giant = 6.5; sfx.whoosh(); toast("👀 Somebody BIG is peeking in! Tap the window!", "gold", 3500); }
  if (S.tower === 1 && floor % MIDNIGHT_EVERY === 0) await midnight();
  if (isShop(floor) && floor < TOP) await shop();
  if (floor % 10 === 0 && floor < TOP) await milestone(floor);
  if (floor >= TOP) await toppingOut();
}

function pickRoom(floor) {
  return new Promise(resolve => {
    const pool = ROOMS.filter(r => r.tower === undefined || r.tower === S.tower);
    const picks = [];
    while (picks.length < 3) { const r = weighted(pool.filter(x => !picks.includes(x)).map(x => ({ ...x, w: roomW(x) }))); picks.push(pool.find(x => x.id === r.id)); }
    const scr = $("cardsScr");
    scr.innerHTML = `<h2>Floor ${floor} is built! What goes here?</h2><div class="cards">${picks.map(r => `<button data-r="${r.id}" class="${r.rare ? "rare" : ""}"><canvas></canvas><b>${esc(r.name)}</b><small>${esc(r.blurb)}</small></button>`).join("")}</div>`;
    scr.hidden = false;
    scr.querySelectorAll("canvas").forEach((c, i) => {
      c.width = c.clientWidth * DPR; c.height = c.clientHeight * DPR;
      const cc = c.getContext("2d"); cc.scale(DPR, DPR);
      drawWith(cc, () => drawRoom(picks[i].id, 0, 0, c.clientWidth, c.clientHeight, 1, tower(), true));
    });
    const done = id => { scr.hidden = true; CH = null; sfx.right(); resolve(id); };
    scr.querySelector(".cards").addEventListener("click", e => { const b = e.target.closest("button"); if (b) done(b.dataset.r); });
    CH = { kind: "cards", answer: 0, solve: () => done(picks[0].id) };
  });
}

/** A screen that waits for one tap on its button. */
function eventScreen(html, btn = "OK", onShow) {
  return new Promise(resolve => {
    const scr = $("eventScr");
    scr.innerHTML = html + `<button class="btn go" id="evOk">${btn}</button>`;
    scr.hidden = false;
    if (onShow) onShow(scr);
    const done = () => { scr.hidden = true; CH = null; resolve(); };
    $("evOk").addEventListener("click", done);
    CH = { kind: "event", solve: done };
  });
}

    if (kind === "towers") { const t = TOWERS.find(x => x.id === id); known = S.done.some(d => d.id === id) || tower().id === id; name = t.name; facts = t.facts; art = (w, h) => drawTowerThumb(t, w, h, S.done.some(d => d.id === id)); }

    draws.push(["jArt", art, !known]);
  } else {
    const items = jTab === "guests" ? GUESTS.map(g => ({ id: g.id, name: g.name, known: !!S.met[g.id], art: (w, h) => drawGuest(g.id, w / 2, h * (g.float ? 0.75 : 0.95), h * (g.wide ? 0.45 : 0.85), 1, w * 0.9) }))
      : jTab === "rooms" ? ROOMS.map(r => ({ id: r.id, name: r.name, known: !!S.rooms[r.id], art: (w, h) => drawRoom(r.id, 0, h * 0.15, w, h * 0.7, 1, tower(), true) }))
      : jTab === "towers" ? TOWERS.map(t => ({ id: t.id, name: t.name, known: S.done.some(d => d.id === t.id) || tower().id === t.id, art: (w, h) => drawTowerThumb(t, w, h, S.done.some(d => d.id === t.id)) }))
      : null;
    if (items) {
      body = `<div class="tag">${items.filter(i => i.known).length} of ${items.length}${jTab === "guests" ? " guests met" : jTab === "rooms" ? " rooms built" : " towers"}</div><div class="jgrid">${items.map((it, k) => `<button data-page="${it.id}"><canvas id="jc${k}"></canvas><span class="${it.known ? "" : "unmet"}">${it.known ? esc(it.name) : "???"}</span></button>`).join("")}</div>`;
      items.forEach((it, k) => draws.push(["jc" + k, it.art, !it.known]));
    } else {
      body = `<div class="tag">${STICKERS.filter(s => S.stickers[s.id]).length} of ${STICKERS.length} stickers</div><div class="jgrid">${STICKERS.map(s => `<button disabled style="opacity:${S.stickers[s.id] ? 1 : 0.45}"><span style="font-size:52px;filter:${S.stickers[s.id] ? "none" : "grayscale(1) brightness(.4)"}">${s.em}</span><span>${S.stickers[s.id] ? esc(s.name) : "???"}</span><small style="color:var(--dim);font-weight:800">${esc(s.how)}</small></button>`).join("")}</div>`;
    }
    body += `<button class="btn" id="jClose">Close</button>`;
  }
  scr.innerHTML = head + body;
  for (const [id, art, dark] of draws) {
    const c = $(id); if (!c) continue;
    c.width = c.clientWidth * DPR; c.height = c.clientHeight * DPR;
    const cc = c.getContext("2d"); cc.scale(DPR, DPR);
    drawWith(cc, () => art(c.clientWidth, c.clientHeight));
    if (dark) { cc.globalCompositeOperation = "source-in"; cc.fillStyle = "#2a2135"; cc.fillRect(0, 0, c.clientWidth, c.clientHeight); cc.globalCompositeOperation = "source-over"; }
  }
  scr.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    sfx.click();
    if (b.dataset.tab) { jTab = b.dataset.tab; journal(); }
    else if (b.dataset.page) journal({ kind: jTab, id: b.dataset.page });
    else if (b.id === "jBack") journal();
    else if (b.id === "jClose") scr.hidden = true;
  };
}
function drawTowerThumb(t, w, h, done) {
  const tw = w * 0.5, x = (w - tw) / 2, fh = h * 0.12;
  for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? t.wall : t.wall2; ctx.fillRect(x, h - fh * (i + 1), tw, fh); for (let k = 0; k < 3; k++) { ctx.fillStyle = t.win; ctx.fillRect(x + tw * (0.15 + k * 0.28), h - fh * (i + 1) + fh * 0.25, tw * 0.14, fh * 0.45); } }
  ctx.strokeStyle = t.trim; ctx.lineWidth = 3; ctx.strokeRect(x, h - fh * 6, tw, fh * 6);
  if (t.id === "starscraper") { ctx.fillStyle = t.trim; ctx.fillRect(x + tw * 0.35, h - fh * 6.6, tw * 0.3, fh * 0.6); poly([x + tw / 2 - 4, h - fh * 6.6, x + tw / 2 + 4, h - fh * 6.6, x + tw / 2, h - fh * 8.4], "#9fb8c8"); ell(x + tw / 2, h - fh * 8.5, 4, 4, "#ff4d4d"); }
  else poly([x - 8, h - fh * 6, x + tw / 2, h - fh * 8, x + tw + 8, h - fh * 6], t.trim);
  if (done) { ctx.save(); ctx.shadowColor = "#ffe14d"; ctx.shadowBlur = 16; starPath(w / 2, h * 0.1, h * 0.09, h * 0.04); ctx.fillStyle = "#ffd75e"; ctx.fill(); ctx.restore(); }
}

/* ---------- Wiring */
$("playBtn").addEventListener("click", startPlay);
$("homeJournal").addEventListener("click", () => journal());
$("journalBtn").addEventListener("click", () => { if (!busy) journal(); });
$("homeBtn").addEventListener("click", () => { if (!busy) { save(); goHome(); } });
$("playerBtn").addEventListener("click", () => playersScreen());
$("soundBtn").addEventListener("click", () => { S.settings.sound = !S.settings.sound; save(); goHome(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

/* =====================================================================
   Test hooks: ?debug exposes window.__mm, ?test= stages an event.
   ===================================================================== */
function setFloor(n) {
  n = clamp(Math.floor(n), 0, TOP);
  const rooms = ROOMS.filter(r => r.tower === undefined || r.tower === S.tower);
  while (S.floors.length > n) S.floors.pop();
  while (S.floors.length < n) S.floors.push({ room: rooms[S.floors.length % rooms.length].id, guests: [WANDERERS[S.floors.length % WANDERERS.length]] });
  save(); cam.y = null; hud();
}
function setTower(i) {
  S.tower = clamp(Math.floor(i), 0, TOWERS.length - 1); S.floors = [];
  save(); cam.y = null; hud();
}
if (DEBUG) {
  window.__mm = {
    get state() { return S; },
    get ch() { return CH ? { kind: CH.kind, answer: CH.answer, q: CH.q ? { text: CH.q.text, answer: CH.q.answer } : null } : null; },
    get busy() { return busy; },
    setFloor, setTower,
    checkIn(id) { if (!GUEST[id]) return false; meet(id); const f = S.floors[S.floors.length - 1]; if (f && !f.guests.includes(id)) f.guests.push(id); save(); return true; },
    solve() { if (CH && CH.solve) { CH.solve(); return true; } return false; },
    doorPos() { return doorRect ? { x: doorRect.x + doorRect.w / 2, y: doorRect.y + doorRect.h / 2 } : null; },
    sample(kind, mode, ...more) { if (kind === "code") { const keep = S.settings.mode; S.settings.mode = mode || keep; try { const q = genQuestion({ mode }); return { text: q.text, ask: q.ask, answer: q.answer, mode: q.mode }; } finally { S.settings.mode = keep; } } return GEN[kind](mode, ...more); },
    checkRoom, makePlan, EVENTS, TOP, TOWERS: TOWERS.length, NOTES, SIGNS, GUESTS: GUESTS.map(g => g.id), ROOMS: ROOMS.map(r => r.id),
    openDoor, journal, goHome, startPlay,
  };
}
function stageTest(what) {
  S.settings.picked = true;
  startPlay();
  if (what === "star") { setFloor(TOP); setTimeout(() => { busy = true; toppingOut().finally(() => { busy = false; hud(); save(); }); }, 300); }
  else if (what === "journal") { for (const g of GUESTS) S.met[g.id] = true; for (const r of ROOMS) S.rooms[r.id] = true; save(); journal(); }
  else if (what.startsWith("guest:")) {
    const id = what.slice(6), ev = VISITORS.includes(id) ? null : Object.keys(EVENTS).find(k => [].concat(EVENTS[k].guest).includes(id)) || (EVENTS[id] ? id : null);
    if (!ev && !VISITORS.includes(id)) return;
    stagedGuest = id;
    if (built() >= TOP) { S.floors = []; hud(); }
    if (ev) planFor(S.tower)[built() + 1] = ev; else delete planFor(S.tower)[built() + 1];
    save();
    setTimeout(openDoor, 300);
  }
}

/* ---------- Boot */
requestAnimationFrame(frame);
goHome();
if (Q.get("test")) stageTest(Q.get("test"));
</script>
